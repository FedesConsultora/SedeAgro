# PASO 2: Reemplazar el bootstrap con este archivo DESPUÉS de tener el certificado.
# nginx del proxy global (fedes-proxy) apunta al frontend de SedeAgro por fedes-net.
# El frontend interno maneja el proxy a /api -> backend:3001 (ver frontend/nginx.conf).

server {
  listen 80;
  server_name sedeagro.fedes.ai;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
    allow all;
  }

  location / {
    return 301 https://sedeagro.fedes.ai$request_uri;
  }
}

server {
  listen 443 ssl;
  server_name sedeagro.fedes.ai;

  ssl_certificate /etc/letsencrypt/live/sedeagro.fedes.ai/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/sedeagro.fedes.ai/privkey.pem;

  client_max_body_size 50M;
  proxy_read_timeout    300s;
  proxy_connect_timeout 60s;
  proxy_send_timeout    300s;

  location / {
    proxy_pass         http://sedeagro_frontend:80;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }
}
