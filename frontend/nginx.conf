server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # The TLS edge proxy supplies HTTPS/HSTS. This container serves the public
  # static SPA and its same-origin API proxy over the private Docker network.
  # React currently uses style props, so style-src allows inline styles;
  # JavaScript remains limited to same-origin bundled scripts.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;

  location /api/ {
    proxy_pass http://sedeagro_backend:3001/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /health {
    proxy_pass http://sedeagro_backend:3001/health;
  }

  # Avoid serving an old HTML shell or service worker after a deployment.
  # Content-hashed Vite bundles can be cached indefinitely.
  location = /index.html {
    expires -1;
    try_files $uri =404;
  }

  location = /sw.js {
    expires -1;
    try_files $uri =404;
  }

  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
