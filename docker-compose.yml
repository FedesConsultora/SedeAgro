name: sedeagro

services:
  db:
    image: postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
    container_name: sedeagro_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sedeagro}
      POSTGRES_USER: ${POSTGRES_USER:-sedeagro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - sedeagro_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sedeagro} -d ${POSTGRES_DB:-sedeagro}"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - sedeagro_internal

  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    container_name: sedeagro_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - sedeagro_redis:/data
    networks:
      - sedeagro_internal

  backend:
    build:
      context: ./backend
      target: prod
      args:
        RELEASE_SHA: ${SEDEAGRO_RELEASE_SHA:?Approved release SHA is required}
    container_name: sedeagro_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      PORT: 3001
      DATABASE_URL: postgres://${APP_DB_USER:-sedeagro_app}:${APP_DB_PASSWORD:?APP_DB_PASSWORD is required}@db:5432/${POSTGRES_DB:-sedeagro}
      REDIS_URL: redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    # Sin ports: el backend NO se expone al host, solo al frontend interno
    networks:
      - sedeagro_internal

  frontend:
    build:
      context: ./frontend
      target: prod
      args:
        VITE_API_URL: /api
        RELEASE_SHA: ${SEDEAGRO_RELEASE_SHA:?Approved release SHA is required}
    container_name: sedeagro_frontend
    restart: unless-stopped
    depends_on:
      - backend
    # Sin ports: el proxy global (fedes-proxy) accede por fedes-net
    networks:
      - sedeagro_internal
      - fedes-net

volumes:
  sedeagro_db:
  sedeagro_redis:

networks:
  sedeagro_internal:
    name: sedeagro_internal
  fedes-net:
    external: true
