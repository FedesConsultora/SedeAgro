# PASO 1: Copiar este archivo PRIMERO como sedeagro.fedes.ai.conf
# Sirve solo para que certbot pueda resolver el challenge ACME via HTTP.
# Una vez que tengas el certificado, reemplazarlo con sedeagro.fedes.ai.conf (el SSL completo).

server {
  listen 80;
  server_name sedeagro.fedes.ai;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
    allow all;
  }

  location / {
    return 301 https://sedeagro.fedes.ai$request_uri;
  }
}
