          path: ${{ runner.temp }}/sedeagro-oci/
      - name: Download exact signed SBOM, vulnerability scans and security receipt from producer
        uses: actions/download-artifact@v4
        with:
          name: sedeagro-security-${{ github.sha }}
          path: ${{ runner.temp }}/sedeagro-security/
      - name: Check GitHub Sigstore signatures and exact file bytes before Docker import
        env:
