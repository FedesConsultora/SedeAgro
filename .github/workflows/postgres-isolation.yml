          # receipt and verify all five GitHub Sigstore signed subjects.
          # A HIGH/CRITICAL finding stays release BLOCKED despite green CI.
          node scripts/verify-image-security.mjs --mode verify-signed \
            --sha "$IMAGE_SHA" --dir "$RUNNER_TEMP/sedeagro-security" \
