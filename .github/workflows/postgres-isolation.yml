name: PostgreSQL tenant isolation
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tenant-rls:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: sedeagro_test
          POSTGRES_USER: sedeagro_owner
          POSTGRES_PASSWORD: temporary-ci-owner-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sedeagro_owner -d sedeagro_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert checkout is the exact event HEAD
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install workspace dependencies
        run: npm ci
      - name: Static audit and unit tests
        run: |
          npm run audit
          npm run check:syntax
          bash -n scripts/verify-pilot-staging.sh
          node --test scripts/test/staging-smoke-guards.test.mjs
          bash -n scripts/deploy-prod.sh
          bash -n scripts/production-preflight.sh
          node --test scripts/test/production-preflight.test.mjs
          bash -n scripts/verify-production-backup.sh
          node --test scripts/test/production-backup-guards.test.mjs
          bash -n scripts/verify-fresh-install-db.sh
          node --test scripts/test/fresh-install-guards.test.mjs
          node --test scripts/test/production-container-guards.test.mjs
          bash -n scripts/check-report-worker-compose.sh
          node --test scripts/test/report-worker-compose-health.test.mjs
          node --test scripts/test/security-audit-report.test.mjs scripts/test/security-moderate-policy.test.mjs
          node --test scripts/test/production-security-gate.test.mjs
          node --test scripts/test/focus-stress-config.test.mjs
          node --test scripts/test/benchmark-review-queue.test.mjs
          node --test scripts/test/benchmark-review-queue-http.test.mjs
          node --check scripts/verify-frontend-headers.mjs
          node --check scripts/verify-deployed-staging.mjs
          node --test scripts/test/staging-remote-provenance.test.mjs
          node --check scripts/verify-staging-topology.mjs
          node --check scripts/verify-staging-runtime.mjs
          node --test scripts/test/staging-topology.test.mjs scripts/test/staging-runtime.test.mjs
          node --check scripts/verify-frontend-image-parity.mjs
          node --test scripts/test/frontend-image-parity.test.mjs
          bash -n scripts/ci-rollback-rehearsal.sh
          node --test scripts/test/rollback-decision.test.mjs scripts/test/ci-rollback-rehearsal.test.mjs
          bash -n scripts/ci-disposable-restore.sh
          bash -n scripts/ci-independent-recovery.sh
          node --test scripts/test/ci-independent-recovery.test.mjs
          node --test scripts/test/disposable-restore-guards.test.mjs
          npm --workspace backend run test
      - name: Test offline browser queue
        run: npm --workspace frontend run test
      - name: Build React frontend
        run: npm --workspace frontend run build
      - name: Prove real untouched PostGIS bootstrap footprint before migrations
        run: |
          result="$(docker exec -i "${{ job.services.postgres.id }}" psql -X -A -t -q \
            -U sedeagro_owner -d sedeagro_test -v ON_ERROR_STOP=1 \
            < scripts/sql/first-install-footprint.sql)"
          if [[ "$result" != '0|0' ]]; then
            printf 'BLOCKED: fresh disposable PostGIS has non-extension object/schema counts: %s\n' "$result" >&2
            exit 1
          fi
      - name: Migrate disposable PostGIS database
        env:
          DATABASE_URL: postgres://sedeagro_owner:temporary-ci-owner-password@localhost:5432/sedeagro_test
          NODE_ENV: test
          SEED_MODE: ci
        run: npm --workspace backend run db:prepare
      - name: Prove real migrated PostGIS cannot use first-install bypass
        run: |
          result="$(docker exec -i "${{ job.services.postgres.id }}" psql -X -A -t -q \
            -U sedeagro_owner -d sedeagro_test -v ON_ERROR_STOP=1 \
            < scripts/sql/first-install-footprint.sql)"
          [[ "$result" =~ ^[0-9]+\|[0-9]+$ ]] && test "$result" != '0|0'
      - name: Provision least-privilege runtime role
        run: |
          docker exec -i "${{ job.services.postgres.id }}" psql \
            -U sedeagro_owner -d sedeagro_test -v ON_ERROR_STOP=1 \
            -v db_owner=sedeagro_owner -v app_user=sedeagro_app \
            -v app_password=temporary-ci-runtime-password \
            < scripts/provision-runtime-role.sql
      - name: Test tenant RLS, secrets and cross-tenant FK
        env:
          TEST_DATABASE_ADMIN_URL: postgres://sedeagro_owner:temporary-ci-owner-password@localhost:5432/sedeagro_test
          TEST_DATABASE_APP_URL: postgres://sedeagro_app:temporary-ci-runtime-password@localhost:5432/sedeagro_test
        run: npm --workspace backend run test:db
      - name: Profile review queue filters under real runtime FORCE RLS at two scales
        env:
          TEST_DATABASE_ADMIN_URL: postgres://sedeagro_owner:temporary-ci-owner-password@localhost:5432/sedeagro_test
          TEST_DATABASE_APP_URL: postgres://sedeagro_app:temporary-ci-runtime-password@localhost:5432/sedeagro_test
          SEDEAGRO_PERF_PROBE: I_ACCEPT_DISPOSABLE_POSTGIS_PERF_ONLY
        run: node scripts/benchmark-review-queue.mjs
      - name: Rehearse disposable PostGIS backup, restore and restored-db RLS
        env:
          CI_POSTGIS_CONTAINER: ${{ job.services.postgres.id }}
          RESTORE_TEST_APP_PASSWORD: temporary-ci-runtime-password
          SEDEAGRO_DISPOSABLE_RESTORE: I_ACCEPT_ONLY_CI_TEST_DATABASES
        run: bash scripts/ci-disposable-restore.sh --run
      - name: Run real Chromium cookie and session acceptance against PostgreSQL
        env:
          TEST_DATABASE_ADMIN_URL: postgres://sedeagro_owner:temporary-ci-owner-password@localhost:5432/sedeagro_test
          TEST_DATABASE_APP_URL: postgres://sedeagro_app:temporary-ci-runtime-password@localhost:5432/sedeagro_test
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install chromium --with-deps
          # Two fresh Chromium/browser contexts + backend processes against the
          # same disposable PostGIS. Each tests 12 open/close keyboard cycles
          # and the deliberate held-HTTP disabled-to-enabled transition.
          for pass in 1 2; do
            echo "FOCUS_STRESS_PASS=$pass/2 exact SHA: $(git rev-parse HEAD)"
            SEDEAGRO_FOCUS_STRESS_CYCLES=12 node scripts/acceptance-browser-cookie.mjs
          done
      - name: Run real Chromium evidence pagination, offline and revoked session acceptance
        env:
          TEST_DATABASE_ADMIN_URL: postgres://sedeagro_owner:temporary-ci-owner-password@localhost:5432/sedeagro_test
          TEST_DATABASE_APP_URL: postgres://sedeagro_app:temporary-ci-runtime-password@localhost:5432/sedeagro_test
        run: node scripts/acceptance-browser-evidence-history.mjs
      - name: Run real Chromium coordination inbox pagination, recovery and tenant isolation
        env:
          TEST_DATABASE_ADMIN_URL: postgres://sedeagro_owner:temporary-ci-owner-password@localhost:5432/sedeagro_test
          TEST_DATABASE_APP_URL: postgres://sedeagro_app:temporary-ci-runtime-password@localhost:5432/sedeagro_test
          SEDEAGRO_HTTP_LOAD_PROBE: I_ACCEPT_ONLY_GITHUB_DISPOSABLE_TEST_DATABASE
        run: node scripts/acceptance-browser-review-inbox.mjs

  browser-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert checkout is the exact event HEAD
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install project and pinned browser-test runner
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.58.2
      - name: Install Chromium for offline browser gate
        run: npx playwright install chromium --with-deps
      - name: Build production SPA
        run: npm --workspace frontend run build
      - name: Real-browser IndexedDB migration, encryption and offline reload
        run: node frontend/test/offlineBrowser.mjs
      - name: Verify production Nginx security headers and static cache
        run: |
          docker run --rm --add-host sedeagro_backend:127.0.0.1 \
            -v "$PWD/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine nginx -t
          docker run --rm -d --name sedeagro-nginx-pilot \
            --add-host sedeagro_backend:127.0.0.1 \
            -p 127.0.0.1:4182:80 \
            -v "$PWD/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/frontend/dist:/usr/share/nginx/html:ro" \
            nginx:1.27-alpine
          trap 'docker stop sedeagro-nginx-pilot >/dev/null 2>&1 || true' EXIT
          node scripts/verify-frontend-headers.mjs http://127.0.0.1:4182
          node scripts/staging-release-manifest.mjs create
          node scripts/staging-release-manifest.mjs verify
          SEDEAGRO_CI_LOOPBACK=1 node scripts/verify-deployed-staging.mjs \
            --url http://127.0.0.1:4182 --ci-loopback \
            --sha "$(git rev-parse HEAD)" --manifest staging-release-manifest.json
      - name: Verify reproducible staging release hashes
        run: |
          node scripts/staging-release-manifest.mjs create
          node scripts/staging-release-manifest.mjs verify
      - name: Preserve staging artifact for integrated main only
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: sedeagro-staging-${{ github.sha }}
          path: |
            frontend/dist/
            staging-release-manifest.json
          if-no-files-found: error
          retention-days: 14

  production-images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert image build checkout is exact event HEAD
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Verify fully isolated staging Compose using actual Docker Compose parser
        env:
          SEDEAGRO_STAGING_SHA: ${{ env.IMAGE_SHA }}
          SEDEAGRO_STAGING_HOST: staging.ci.test
          SEDEAGRO_STAGING_OWNER_PASSWORD: 8v7XqaWn3Fpr6Kjh9MNpQ5aZ2R4uLc
          SEDEAGRO_STAGING_APP_PASSWORD: 4sFdYqB2Cj6YtK8nQv3WX9rmS5VbTp
          SEDEAGRO_STAGING_JWT_SECRET: y6Qn4HprW83JaZ2Ky5QcP9VU6BNmR7dL
        run: |
          set -euo pipefail
          docker compose --env-file /dev/null -f docker-compose.staging.yml \
            config --format json |
            node scripts/verify-staging-topology.mjs \
              --sha "$IMAGE_SHA" --host "$SEDEAGRO_STAGING_HOST"
          # Parse-only; do not up/build/provision/migrate this staging stack.
      - name: Build backend production image from local lockfile
        run: docker build --target prod --build-arg RELEASE_SHA="$IMAGE_SHA" --tag sedeagro-backend-rc:$IMAGE_SHA ./backend
      - name: Verify backend image boots Node22 with production dependencies
        run: |
          docker run --rm --entrypoint sh sedeagro-backend-rc:$IMAGE_SHA -ec '
            node -e "if (!process.version.startsWith(\"v22.\")) process.exit(1)"
            test -f /app/src/server.js
            test -f /app/db/migrations/202610190003_review_queue_view_moderation_audit.js
            node -e "import(\"express\")"
            test ! -f /app/.env
          '
      - name: Build frontend production image from local lockfile
        run: docker build --target prod --build-arg VITE_API_URL=/api --build-arg RELEASE_SHA="$IMAGE_SHA" --tag sedeagro-frontend-rc:$IMAGE_SHA ./frontend
      - name: Verify compiled frontend and production Nginx syntax
        run: |
          docker run --rm --entrypoint sh sedeagro-frontend-rc:$IMAGE_SHA -ec '
            test -s /usr/share/nginx/html/index.html
            test -s /usr/share/nginx/html/sw.js
            test ! -e /usr/share/nginx/html/50x.html
            test ! -e /usr/share/nginx/html/.env
            test ! -e /usr/share/nginx/html/node_modules
          '
          docker run --rm --add-host sedeagro_backend:127.0.0.1 \
            sedeagro-frontend-rc:$IMAGE_SHA nginx -t
      - name: Prove both OCI labels match exact event HEAD
        run: |
          for image in "sedeagro-backend-rc:$IMAGE_SHA" "sedeagro-frontend-rc:$IMAGE_SHA"; do
            actual="$(docker image inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")"
            test "$actual" = "$IMAGE_SHA"
          done
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Independently build trusted frontend artifact from isolated frontend lockfile
        run: |
          set -euo pipefail
          npm --prefix frontend ci
          npm --prefix frontend run build
          node scripts/staging-release-manifest.mjs create
          node scripts/staging-release-manifest.mjs verify
      - name: Compare all real frontend Docker image bytes and Nginx config to trusted CI manifest
        run: |
          set -euo pipefail
          node --check scripts/verify-frontend-image-parity.mjs
          node --test scripts/test/frontend-image-parity.test.mjs
          node scripts/verify-frontend-image-parity.mjs --sha "$IMAGE_SHA"

  dependency-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert audit checkout is exact HEAD
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit exact Docker lockfiles outside root npm workspace
        run: |
          mkdir -p /tmp/sedeagro-audit-backend /tmp/sedeagro-audit-frontend
          cp backend/package.json backend/package-lock.json /tmp/sedeagro-audit-backend/
          cp frontend/package.json frontend/package-lock.json /tmp/sedeagro-audit-frontend/
          (cd /tmp/sedeagro-audit-backend && npm audit --omit=dev --json) > backend-audit.json || true
          (cd /tmp/sedeagro-audit-frontend && npm audit --json) > frontend-audit.json || true
          node scripts/security-audit-report.mjs backend-audit.json frontend-audit.json \
            backend/package-lock.json scripts/security-moderate-baseline.json
      - name: Inspect isolated compatible npm lockfile fixes (diagnostic, never committed)
        if: always()
        run: |
          if [[ ! -f /tmp/sedeagro-audit-backend/package-lock.json || ! -f /tmp/sedeagro-audit-frontend/package-lock.json ]]; then
            echo 'No audit inputs exist; original failure remains authoritative.'
            exit 0
          fi
          cp /tmp/sedeagro-audit-backend/package-lock.json /tmp/sedeagro-backend-before.json
          cp /tmp/sedeagro-audit-frontend/package-lock.json /tmp/sedeagro-frontend-before.json
          (cd /tmp/sedeagro-audit-backend && npm audit fix --package-lock-only --ignore-scripts --no-fund >/dev/null 2>&1) || true
          (cd /tmp/sedeagro-audit-frontend && npm audit fix --package-lock-only --ignore-scripts --no-fund >/dev/null 2>&1) || true
          node scripts/security-lock-delta.mjs backend /tmp/sedeagro-backend-before.json /tmp/sedeagro-audit-backend/package-lock.json
          node scripts/security-lock-delta.mjs frontend /tmp/sedeagro-frontend-before.json /tmp/sedeagro-audit-frontend/package-lock.json
