          receipt="$RUNNER_TEMP/sedeagro-oci/sedeagro-images-$IMAGE_SHA.json"
          node scripts/oci-release-bundle.mjs verify --sha "$IMAGE_SHA" \
            --bundle "$archive" --receipt "$receipt"
