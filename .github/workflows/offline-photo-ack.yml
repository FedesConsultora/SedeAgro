name: Offline photo receipt integrity

on:
  pull_request:
    paths:
      - "frontend/src/services/offlineQueue.js"
      - "frontend/test/offlineEvidence.test.js"
      - ".github/workflows/offline-photo-ack.yml"
  push:
    branches: [main]
    paths:
      - "frontend/src/services/offlineQueue.js"
      - "frontend/test/offlineEvidence.test.js"
      - ".github/workflows/offline-photo-ack.yml"

permissions:
  contents: read

concurrency:
  group: offline-photo-ack-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-photo-ack:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact event HEAD
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax
        run: |
          node --check frontend/src/services/offlineQueue.js
          node --check frontend/test/offlineEvidence.test.js
      - name: Verify photo ACK and idempotent offline regressions
        run: |
          node --test \
            frontend/test/offlineEvidence.test.js \
            frontend/test/photoRecovery.test.js \
            frontend/test/offlineQueue.test.js \
            frontend/test/offlineQueueSingle.test.js
